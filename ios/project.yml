# XcodeGen spec for the iOS host: `xcodegen` in ios/ writes Fieldscape.xcodeproj. The project is
# generated, not committed; this file is the source of truth. build.sh stays the no-Xcode
# simulator path.
name: Fieldscape
options:
  deploymentTarget: { iOS: "16.4" }
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.0.0
targets:
  Fieldscape:
    type: application
    platform: iOS
    sources:
      - App.swift
      - MapView.swift
      - Decode.swift
      - Walk.swift
      - Theme.swift
      - WalkPanel.swift
      - RouteSound.swift
      - path: ../places.geojson
        buildPhase: resources
      - path: Fonts
        buildPhase: resources
      - path: ../core
        excludes: [test.cpp, "tests/**", "devices/*.md", "devices/*.bundle"]
      # test recording (git-ignored; made from the Stretch point, see web/ab.html)
      - path: ../build/ab/stretch.wav
        buildPhase: resources
        optional: true
    dependencies:
      - package: MapLibre
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: net.keremaltaylar.fieldscape
      SWIFT_OBJC_BRIDGING_HEADER: ../core/fieldscape.h
      CLANG_CXX_LANGUAGE_STANDARD: c++17
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Info.plist
      # Optimised even in Debug: ▶ Run is how phones get tested, and -O0 DSP ran ~10x slower
      # (164 ms callbacks on the iPhone 8, 2026-09-24). Debugging steps less precisely; timing is real.
      GCC_OPTIMIZATION_LEVEL: 3
      SWIFT_OPTIMIZATION_LEVEL: -O
