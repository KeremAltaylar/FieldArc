<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fieldscape</title>
<script>
  /* The standard GitHub-Pages SPA redirect (rafgraph/spa-github-pages), trimmed to this
     repo's one case: a project page one level deep (/Fieldscape/...), no extra query params
     or hash to round-trip beyond what a deep link itself carries.
     pathSegmentsToKeep = 1 keeps "/Fieldscape" and rewrites everything after it into "?p=". */
  var pathSegmentsToKeep = 1;
  var l = window.location;
  /* One pass only. Off GitHub Pages — a local server at the repo root, say — pathSegmentsToKeep
     is wrong, the rewritten URL 404s again, and every pass appends another p=. Measured on
     2026-09-21: 150 copies of p=%2F in one address bar. A first pass always has no p= key, so
     this costs a real deep link nothing and costs a loop everything. Checked by key, not by
     substring — a plausible first-party query param like ?map= or ?zoom= also contains the
     text "p=" and must not be mistaken for an already-rewritten URL. index.html's other half
     of this redirect already uses URLSearchParams, so this stays consistent with it. */
  if (!new URLSearchParams(l.search).has("p")) {
    var base = l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/");
    var rest = l.pathname.slice(base.length);
    window.location.replace(l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
      base + "/?p=" + encodeURIComponent(rest) + (l.search ? "&" + l.search.slice(1) : "") + l.hash);
  }
</script>
</head>
<body></body>
</html>
