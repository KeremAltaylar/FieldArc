<!doctype html>
<meta charset="utf-8">
<title>Fieldscape core test</title>
<!-- Renders 1 s of the core's sine through the AudioWorklet offline and prints what it measures.
     Serve the repo root over http (AudioWorklet needs a secure context) and open /web/core-test.html. -->
<pre id="out">running</pre>
<script type="module">
const out = document.getElementById("out");
try {
  const wasm = await (await fetch("core.wasm")).arrayBuffer();
  const ctx = new OfflineAudioContext(2, 48000, 48000);
  await ctx.audioWorklet.addModule("core-worklet.js");
  const node = new AudioWorkletNode(ctx, "fieldscape-core", {
    outputChannelCount: [2], processorOptions: { wasm, device: "sine", params: [[1, 0.2]] }
  });
  node.connect(ctx.destination);
  const buf = await ctx.startRendering();
  const d = buf.getChannelData(0);
  let sum = 0, cross = 0;
  for (let i = 1; i < d.length; i++) { sum += d[i] * d[i]; if ((d[i - 1] < 0) !== (d[i] < 0)) { cross++; } }
  out.textContent = "RESULT rms=" + Math.sqrt(sum / d.length).toFixed(4) + " crossings=" + cross;
} catch (e) {
  out.textContent = "RESULT error " + e;
}
</script>
