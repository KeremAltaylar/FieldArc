<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stretch A/B</title>
<!-- Test 10 of the stretch spec: today's PaulX worklet against the new clean-room engine, same
     recording, same settings, both running at once and level-matched, one audible at a time.
     Serve the repo root over http and open /web/ab.html (build the wasm first: sh web/build.sh).
     Default recording: build/ab/stretch.webm (git-ignored); any file can be dropped in instead. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Courier+Prime&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --sunk: oklch(18% 0.012 162); --ground: oklch(24% 0.014 162); --panel: oklch(28% 0.015 162);
    --raised: oklch(33% 0.016 162); --hairline: oklch(36% 0.016 162);
    --ink: oklch(92.5% 0.006 150); --dim: oklch(78% 0.011 150); --faint: oklch(71% 0.013 150);
    --accent: oklch(83% 0.040 138); --lamp: oklch(88% 0.085 140);
    --font-display: "Cormorant Garamond", serif; --font-body: "Newsreader", serif; --font-mono: "Courier Prime", monospace;
    --t-xs: 0.68rem; --t-sm: 0.78rem; --t-base: 1.0625rem; --t-lg: clamp(1.5rem, 2.4vw, 1.9rem);
    --track-meta: 0.18em; --s-2: 0.5rem; --s-3: 0.75rem; --s-4: 1rem; --s-5: 1.5rem; --s-6: 2rem;
    --d-fast: 180ms; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--ground); color: var(--ink); font: var(--t-base)/1.5 var(--font-body);
         display: grid; place-items: center; padding: var(--s-5) var(--s-4); }
  main { width: min(100%, 44rem); display: grid; gap: var(--s-5); }
  h1 { margin: 0; font: 500 var(--t-lg)/1.1 var(--font-display); }
  .meta, label span, output, button, select { font-family: var(--font-mono); font-size: var(--t-sm); }
  .meta { color: var(--faint); letter-spacing: var(--track-meta); text-transform: uppercase; font-size: var(--t-xs); }
  section { background: var(--panel); border: 1px solid var(--hairline); border-radius: 10px; padding: var(--s-4); display: grid; gap: var(--s-4); }
  .ab { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); }
  .ab button { padding: var(--s-4); border-radius: 8px; border: 1px solid var(--hairline); background: var(--sunk); color: var(--dim);
               display: grid; gap: var(--s-2); text-align: left; cursor: pointer; transition: border-color var(--d-fast), color var(--d-fast); }
  .ab button[aria-pressed="true"] { border-color: var(--lamp); color: var(--ink); }
  .ab button b { font: 500 var(--t-lg)/1 var(--font-display); }
  .meter { height: 4px; background: var(--raised); border-radius: 2px; overflow: hidden; }
  .meter i { display: block; height: 100%; width: 0; background: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); gap: var(--s-4) var(--s-5); }
  label { display: grid; gap: var(--s-2); }
  label span { color: var(--dim); display: flex; justify-content: space-between; }
  label span em { color: var(--faint); font-style: normal; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  select, .row button { background: var(--sunk); color: var(--ink); border: 1px solid var(--hairline); border-radius: 6px; padding: var(--s-2) var(--s-3); }
  .row { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; }
  .row button { cursor: pointer; }
  input[type="file"] { color: var(--faint); font: var(--t-sm) var(--font-mono); }
  input[type="file"]::file-selector-button { background: var(--sunk); color: var(--ink); border: 1px solid var(--hairline); border-radius: 6px; padding: var(--s-2) var(--s-3); margin-right: var(--s-3); font: inherit; cursor: pointer; }
  .row button:hover, .ab button:hover { border-color: var(--accent); }
  :focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
  #status { color: var(--faint); font-family: var(--font-mono); font-size: var(--t-sm); min-height: 1.5em; }
  #status.err { color: var(--lamp); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<main>
  <header>
    <div class="meta">Fieldscape · stretch test 10</div>
    <h1>Current engine vs new engine</h1>
  </header>

  <section>
    <div class="row">
      <button id="play">Start</button>
      <label class="row"><input type="checkbox" id="blind"> <span>Blind (hide which is which)</span></label>
      <label class="row"><span>Recording</span> <input type="file" id="file" accept="audio/*"></label>
    </div>
    <div class="ab">
      <button id="bA" aria-pressed="true"><span class="meta" id="lA">A</span><b id="nA">Current</b><div class="meter"><i id="mA"></i></div><output id="oA">–</output></button>
      <button id="bB" aria-pressed="false"><span class="meta" id="lB">B</span><b id="nB">New</b><div class="meter"><i id="mB"></i></div><output id="oB">–</output></button>
    </div>
    <div class="meta">Space switches · both keep running · level-matched: <output id="match">–</output></div>
  </section>

  <section>
    <div class="meta">Both engines</div>
    <div class="grid">
      <label><span>Stretch <output id="vStretch"></output></span><input id="stretch" type="range" min="0" max="1" step="0.001" value="0.45"></label>
      <label><span>Window <em>same size in both</em></span>
        <select id="window"><option value="4096">4 096 · 0.09 s</option><option value="8192">8 192 · 0.17 s</option>
          <option value="16384" selected>16 384 · 0.34 s</option><option value="32768">32 768 · 0.68 s</option>
          <option value="65536">65 536 · 1.37 s</option></select></label>
      <label class="row"><input type="checkbox" id="freeze"> <span>Freeze</span></label>
    </div>
    <div class="meta">New engine only</div>
    <div class="grid">
      <label><span>Onset <output id="vOnset"></output></span><input id="onset" type="range" min="0" max="1" step="0.01" value="0"></label>
      <label><span>Width <output id="vWidth"></output></span><input id="width" type="range" min="0" max="1" step="0.01" value="0"></label>
      <label><span>Window shape</span><select id="shape"><option value="0">Original (1−t²)^1.25</option><option value="1">Hann + correction</option></select></label>
    </div>
  </section>
  <div id="status">Press Start.</div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let failed = false;  /* an engine error must stay on screen, not be overwritten by "Playing" */
const status = (t, err) => { if (failed && !err) { return; } failed = failed || !!err; $("status").textContent = t; $("status").className = err ? "err" : ""; };
let ctx, oldNode, newNode, sel = {}, match, anA, anB, playing = "old", swapped = false, running = false, recording;

/* Same parameter block index.html builds for a point (pxParams + pxDefaults), so the current
   engine runs exactly as on a walk: every module off, frequency and pitch shift at zero. */
function oldParams() {
  const n = +$("window").value;
  return { stretch: Math.pow(1024, +$("stretch").value), bufsize: n, freeze: $("freeze").checked, onset: 0,
    start: 0, end: 1, xfade: 0.01, morph: 0, field: 0, warpHz: 0,
    mods: { harmonics: { on: false, n: 10, freq: 128, bw: 25, gauss: false }, tonal: { on: false, bw: 0.74, preserve: 0.5 },
            fshift: { on: true, hz: 0 }, pitch: { on: true, st: 0 },
            ratios: { on: false, r: [0.25, 0.5, 1, 2, 3, 4, 1.5, 1 / 1.5], l: [0, 0, 1, 0, 0, 0, 0, 0] },
            spread: { on: false, bw: 0 }, filter: { on: false, low: 20, high: 20000, stop: false }, compress: { on: false, power: 0 } },
    binaural: { on: false, power: 0.5, hz: 4, mode: 0 } };
}
/* The new device's parameter indices (core/devices/stretch.cpp STRETCH_PARAMS). */
const P = { stretch: 0, window: 1, freeze: 2, onset: 3, width: 4, shape: 5 };
function sendAll() {
  $("vStretch").textContent = Math.pow(1024, +$("stretch").value).toFixed(1) + "×";
  $("vOnset").textContent = +$("onset").value ? (+$("onset").value).toFixed(2) : "off";
  $("vWidth").textContent = (+$("width").value).toFixed(2);
  if (!running) { return; }
  oldNode.port.postMessage({ type: "params", params: oldParams() });
  const s = newNode.port;
  s.postMessage([P.stretch, +$("stretch").value]);
  s.postMessage([P.window, +$("window").value / ctx.sampleRate]);
  s.postMessage([P.freeze, $("freeze").checked ? 1 : 0]);
  s.postMessage([P.onset, +$("onset").value]);
  s.postMessage([P.width, +$("width").value]);
  s.postMessage([P.shape, +$("shape").value]);
}
["stretch", "window", "freeze", "onset", "width", "shape"].forEach((id) => $(id).addEventListener("input", sendAll));

async function loadRecording(buf) {
  const audio = await ctx.decodeAudioData(buf);
  return Array.from({ length: Math.min(2, audio.numberOfChannels) }, (_, c) => audio.getChannelData(c).slice());
}
function feed(channels) {
  oldNode.port.postMessage({ type: "source", channels: channels.map((c) => c.slice()) });
  newNode.port.postMessage({ type: "source", channels: channels.map((c) => c.slice()) });
}

async function start() {
  ctx = new AudioContext({ sampleRate: 48000, latencyHint: "playback" });
  status("Loading engines…");
  const [wasm] = await Promise.all([
    fetch("../build/web/core.wasm").then((r) => { if (!r.ok) { throw new Error("build/web/core.wasm missing — run sh web/build.sh"); } return r.arrayBuffer(); }),
    ctx.audioWorklet.addModule("../src/paulx-worklet.js"), ctx.audioWorklet.addModule("core-worklet.js")]);
  oldNode = new AudioWorkletNode(ctx, "paulx-processor", { numberOfInputs: 0, outputChannelCount: [2] });
  newNode = new AudioWorkletNode(ctx, "fieldscape-core", { numberOfInputs: 0, outputChannelCount: [2],
    processorOptions: { wasm, device: "stretch" } });
  newNode.onprocessorerror = (e) => status("New engine crashed: " + (e.message || e.type), true);
  oldNode.onprocessorerror = (e) => status("Current engine crashed: " + (e.message || e.type), true);
  newNode.port.onmessage = (e) => {
    if (e.data.type === "stats") { stats = e.data; }
    else if (e.data.type === "error") { status("New engine: " + e.data.where + " failed: " + e.data.message, true); }
    else if (e.data.type === "source") { newFrames = e.data.frames; }
  };

  /* old -> analyser A -> selector A;  new -> match gain -> analyser B -> selector B */
  anA = ctx.createAnalyser(); anB = ctx.createAnalyser(); anA.fftSize = anB.fftSize = 2048;
  match = ctx.createGain();
  sel.old = ctx.createGain(); sel.new = ctx.createGain(); sel.new.gain.value = 0;
  oldNode.connect(anA).connect(sel.old).connect(ctx.destination);
  newNode.connect(match).connect(anB).connect(sel.new).connect(ctx.destination);

  status("Decoding recording…");
  recording = recording || await fetch("../build/ab/stretch.webm").then((r) => r.ok ? r.arrayBuffer() : null);
  if (!recording) { status("No default recording — choose a file above.", true); }
  running = true;
  sendAll();
  if (recording) { feed(await loadRecording(recording.slice(0))); status("Playing. Both engines started together from the top."); }
  requestAnimationFrame(meter);
}

/* Level match: long-term RMS of each engine (the new one before its match gain), ~3 s smoothing,
   so switching compares character, not loudness (rulebook A-18). Clamped to +-12 dB. */
let eA = 0, eB = 0, stats, newFrames = 0;
function rms(an) { const d = new Float32Array(an.fftSize); an.getFloatTimeDomainData(d); let s = 0; for (const v of d) { s += v * v; } return s / d.length; }
function meter() {
  const g = match.gain.value || 1, a = rms(anA), b = rms(anB) / (g * g);
  eA += (a - eA) * 0.01; eB += (b - eB) * 0.01;
  if (eA > 1e-9 && eB > 1e-9) {
    const want = Math.min(4, Math.max(0.25, Math.sqrt(eA / eB)));
    match.gain.setTargetAtTime(want, ctx.currentTime, 0.5);
    $("match").textContent = "new " + (20 * Math.log10(want) >= 0 ? "+" : "") + (20 * Math.log10(want)).toFixed(1) + " dB";
  }
  const db = (e) => e > 1e-10 ? 10 * Math.log10(e) : -100;
  const [left, right] = swapped ? ["new", "old"] : ["old", "new"];
  const lvl = { old: db(eA), new: db(eB) + 20 * Math.log10(match.gain.value || 1) };
  $("mA").style.width = Math.max(0, 100 + lvl[left] * 100 / 60) + "%";
  $("mB").style.width = Math.max(0, 100 + lvl[right] * 100 / 60) + "%";
  $("oA").textContent = lvl[left].toFixed(1) + " dBFS";
  $("oB").textContent = lvl[right].toFixed(1) + " dBFS" + (right === "new" && stats && !$("blind").checked ? ` · late ${stats.late} · loops ${stats.wraps}` : "");
  if (left === "new" && stats && !$("blind").checked) { $("oA").textContent += ` · late ${stats.late} · loops ${stats.wraps}`; }
  newNode.port.postMessage({ type: "stats" });
  requestAnimationFrame(meter);
}

/* 30 ms equal-gain crossfade between the two (A-2: no clicks on the switch). */
function listen(which) {
  playing = which;
  const t = ctx.currentTime;
  sel.old.gain.setTargetAtTime(which === "old" ? 1 : 0, t, 0.01);
  sel.new.gain.setTargetAtTime(which === "new" ? 1 : 0, t, 0.01);
  const left = swapped ? "new" : "old";
  $("bA").setAttribute("aria-pressed", String(which === left));
  $("bB").setAttribute("aria-pressed", String(which !== left));
}
function labels() {
  const blind = $("blind").checked, name = { old: "Current", new: "New" };
  const [l, r] = swapped ? ["new", "old"] : ["old", "new"];
  $("nA").textContent = blind ? "X" : name[l];
  $("nB").textContent = blind ? "Y" : name[r];
}
$("blind").addEventListener("change", () => { swapped = $("blind").checked && Math.random() < 0.5; labels(); if (running) { listen(playing); } });
$("bA").onclick = () => running && listen(swapped ? "new" : "old");
$("bB").onclick = () => running && listen(swapped ? "old" : "new");
addEventListener("keydown", (e) => { if (e.code === "Space" && running && e.target.tagName !== "INPUT") { e.preventDefault(); listen(playing === "old" ? "new" : "old"); } });
$("play").onclick = async () => {
  if (!ctx) { try { await start(); $("play").textContent = "Pause"; } catch (e) { status(String(e.message || e), true); } return; }
  if (ctx.state === "running") { await ctx.suspend(); $("play").textContent = "Resume"; } else { await ctx.resume(); $("play").textContent = "Pause"; }
};
$("file").onchange = async () => {
  const f = $("file").files[0]; if (!f) { return; }
  recording = await f.arrayBuffer();
  if (running) { feed(await loadRecording(recording.slice(0))); status("Playing " + f.name + ". Both engines restarted on it."); }
};
sendAll();
</script>
</html>
